<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1456a0"><link rel="manifest" href="manifest.json"><title>Speak English with Prajapati</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f4f7fb;color:#17243a}header{background:linear-gradient(135deg,#1456a0,#287bd0);color:#fff;padding:24px 18px;border-radius:0 0 24px 24px}h1{font-size:25px;margin:0 0 8px}main{max-width:760px;margin:auto;padding:16px}nav{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}nav button,.btn{border:0;border-radius:12px;padding:12px;background:white;color:#1456a0;font-weight:700}nav button.active,.primary{background:#1456a0;color:white}.panel{background:#fff;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 3px 14px #1020400c}h2{font-size:20px;margin:0 0 12px}.muted{color:#607086;font-size:14px}.phrase{padding:12px 0;border-bottom:1px solid #e8edf4}.en{font-size:17px;font-weight:700}.hi{color:#46566c;margin:4px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.small,.answer{border:1px solid #d6e1ef;background:#f6f9ff;color:#1456a0;padding:8px 10px;border-radius:9px;cursor:pointer;font:inherit}.answer{display:block;width:100%;text-align:left;margin:7px 0}footer{text-align:center;color:#718096;font-size:12px;padding:20px}
</style></head><body><header><h1>Speak English with Prajapati</h1><p>Daily English • Hindi meaning • Office English • Practice</p></header><main><nav><button class="active" data-tab="daily">Daily English</button><button data-tab="office">Office English</button><button data-tab="grammar">Grammar</button><button data-tab="quiz">Quiz</button></nav><section id="content"></section><footer>Practice every day and keep improving!</footer></main><script>
const lessons={daily:[["How are you?","आप कैसे हैं?","hau aar yoo"],["I am doing well.","मैं अच्छा हूँ।","ai am doo-ing wel"],["Could you please help me?","क्या आप कृपया मेरी मदद कर सकते हैं?","kud yoo pleez help mee"],["I will call you later.","मैं आपको बाद में फोन करूँगा।","ai wil kaal yoo lay-ter"],["Please speak slowly.","कृपया धीरे बोलिए।","pleez speek slow-lee"],["I did not understand.","मुझे समझ नहीं आया।","ai did not un-der-stand"],["Let me check and confirm.","मुझे जाँचकर पुष्टि करने दीजिए।","let mee chek and kon-furm"],["Thank you for your support.","आपके सहयोग के लिए धन्यवाद।","thank yoo for yor suh-port"]],office:[["I have completed the task.","मैंने काम पूरा कर लिया है।","ai hav kum-plee-tid the task"],["Please find the file attached.","कृपया संलग्न फाइल देखें।","pleez faind the fail uh-tacht"],["Could you please clarify this point?","क्या आप इस बात को स्पष्ट कर सकते हैं?","kud yoo pleez kla-ri-fai this point"],["I will share an update shortly.","मैं थोड़ी देर में अपडेट साझा करूँगा।","ai wil share an up-dayt short-lee"],["The entry is pending approval.","एंट्री अनुमोदन के लिए लंबित है।","the en-tree iz pen-ding uh-proo-vul"],["I will look into this issue.","मैं इस समस्या को देखूँगा।","ai wil luk in-too this ish-yoo"],["Please let me know if anything is needed.","अगर कुछ चाहिए तो कृपया बताइए।","pleez let mee no if en-ee-thing iz nee-did"],["We need to resolve this before closing.","हमें क्लोजिंग से पहले इसे हल करना है।","wee need to ri-zolv this bi-for klo-zing"]],grammar:[["I work every day.","मैं हर दिन काम करता हूँ।","Simple Present: नियमित काम या आदत।"],["I am working now.","मैं अभी काम कर रहा हूँ।","Present Continuous: अभी चल रहा काम।"],["I completed the task.","मैंने काम पूरा किया।","Simple Past: बीते समय में पूरा हुआ काम।"],["I have completed the task.","मैंने काम पूरा कर लिया है।","Present Perfect: काम पूरा हो चुका है।"],["I will send the file.","मैं फाइल भेजूँगा।","Simple Future: भविष्य का काम।"]]};let tab='daily',qi=0,score=0;const content=document.getElementById('content');function speak(t){if(!('speechSynthesis'in window)){alert('Speech playback is not supported.');return}let u=new SpeechSynthesisUtterance(t);u.lang='en-IN';speechSynthesis.speak(u)}function practiced(k,b){let a=JSON.parse(localStorage.getItem('sp-practiced')||'[]');if(!a.includes(k))a.push(k);localStorage.setItem('sp-practiced',JSON.stringify(a));b.textContent='✓ Practiced';progress()}function progress(){let e=document.getElementById('progress'),a=JSON.parse(localStorage.getItem('sp-practiced')||'[]');if(e)e.textContent='You have practiced '+a.length+' sentences.'}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='quiz'){quiz();return}if(tab==='daily'||tab==='office'){let items=lessons[tab];content.innerHTML='<div class="panel"><h2>'+(tab==='daily'?'Daily English Practice':'English for Office')+'</h2><p class="muted">Read the sentence, understand the Hindi meaning, then speak aloud.</p>'+items.map((x,i)=>'<div class="phrase"><div class="en">'+(i+1)+'. '+x[0]+'</div><div class="hi">'+x[1]+'</div><div class="muted">Pronunciation: '+x[2]+'</div><div class="row"><button class="small" onclick="speak('+JSON.stringify(x[0]).replace(/"/g,'&quot;')+')">🔊 Listen</button><button class="small" onclick="practiced(\''+tab+'-'+i+'\',this)">Mark practiced</button></div></div>').join('')+'</div><div class="panel"><h3>Your progress</h3><p id="progress" class="muted"></p></div>';progress()}else content.innerHTML='<div class="panel"><h2>Easy Grammar Notes</h2><p class="muted">Examples with simple Hindi explanations.</p>'+lessons.grammar.map(x=>'<div class="phrase"><div class="en">'+x[0]+'</div><div class="hi">'+x[1]+'</div><div class="muted">'+x[2]+'</div><button class="small" onclick="speak('+JSON.stringify(x[0]).replace(/"/g,'&quot;')+')">🔊 Listen</button></div>').join('')+'</div>'}function quiz(){let qs=[{q:'What does “Please speak slowly” mean?',a:['कृपया धीरे बोलिए','मैं बाद में आऊँगा','काम पूरा हो गया'],c:0},{q:'Choose the correct office sentence.',a:['I has completed the task.','I have completed the task.','I completed tomorrow the task.'],c:1},{q:'“I will call you later” means:',a:['मैंने फोन किया','मैं अभी फोन कर रहा हूँ','मैं आपको बाद में फोन करूँगा'],c:2}];if(qi>=qs.length){content.innerHTML='<div class="panel"><h2>Quiz complete!</h2><p>Your score: '+score+'/'+qs.length+'</p><button class="btn primary" onclick="qi=0;score=0;render()">Try again</button></div>';return}let q=qs[qi];content.innerHTML='<div class="panel"><h2>Quick Quiz ('+(qi+1)+'/'+qs.length+')</h2><h3>'+q.q+'</h3>'+q.a.map((a,i)=>'<button class="answer" onclick="answer('+i+','+q.c+')">'+a+'</button>').join('')+'<p class="muted">Score: '+score+'</p></div>'}function answer(i,c){if(i===c)score++;qi++;quiz()}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));render();
</script></body></html>
